# =============================================================================
# DAI rsyslog 客戶端轉發設定（VM1 / VM3 / VM5 通用）
# 部署路徑：/etc/rsyslog.d/20-dai-client.conf
# =============================================================================
# 部署後請把 __VM4_IP__ 換成 VM4 的實際 IP：
#   sed -i 's/__VM4_IP__/<VM4實際IP>/g' /etc/rsyslog.d/20-dai-client.conf
# =============================================================================

# 本機保存格式
template(name="DAILocalFmt" type="string"
  string="DAI|%TIMESTAMP:::date-rfc3339%|%HOSTNAME%|%syslogtag:R,ERE,1,ZERO:dai/([a-zA-Z0-9_-]+)--end%|%syslogseverity-text:::uppercase%|%msg:::drop-last-lf%\n")


# 本機保存路徑
template(name="DAILocalFile" type="string"
  string="/var/log/dai/local/%syslogtag:R,ERE,1,ZERO:dai/([a-zA-Z0-9_-]+)--end%/%$YEAR%-%$MONTH%-%$DAY%.log")


# 只處理本機產生 dai/* log
if $syslogtag contains "dai/" then {

  # ============================================================
  # 1. 本機保存副本
  # ============================================================
  action(type="omfile"
         DynaFile="DAILocalFile"
         Template="DAILocalFmt"
         dirCreateMode="0750"
         fileCreateMode="0640"
         dirOwner="root"
         dirGroup="dai_admin"
         fileOwner="root"
         fileGroup="dai_admin")

# =============================================================================
# 可靠傳輸佇列設定
# queue.type="LinkedList"     : 佇列類型（非阻塞）
# queue.size="10000"          : 最多暫存 10000 則訊息
# queue.filename              : 佇列持久化到磁碟（VM 重啟後補發）
# action.resumeRetryCount="-1": 無限重試（直到 VM4 恢復）
# =============================================================================

# 只轉發本機產生的 dai/* log（$fromhost-ip == 127.0.0.1）
# 防止接收到其他主機轉來的 log 再次回傳（防迴圈）

  action(type="omfwd"
         target="__VM4_IP__"
         port="514"
         protocol="tcp"
         queue.type="LinkedList"
         queue.size="10000"
         queue.filename="dai_fwd_q"
         queue.saveOnShutdown="on"
         action.resumeRetryCount="-1"
         action.resumeInterval="30")
  # 本機不存副本（節省測試 VM 磁碟）
  # 正式環境建議同時寫本機：加一個 omfile action
  stop
}
