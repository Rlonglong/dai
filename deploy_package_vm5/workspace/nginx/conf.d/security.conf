# deploy/workspace/nginx/conf.d/security.conf

# 隱藏 Server 標頭裡的 nginx 版本號（見 setting.md：Server 標頭版本與
# 錯誤頁內文版本不一致的問題，待查；此設定至少降低版本資訊外洩範圍）
server_tokens off;

# SSL/TLS 協定與加密演算法
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
ssl_prefer_server_ciphers on;

# 常用資安 Headers (加上 always 確保 403, 404 等錯誤頁面也會帶上)
include conf.d/security_headers.conf;

# 跟 nginx_vm3 保持一致，避免後端（Keycloak/Dagster/Superset）洩漏技術棧標頭
proxy_hide_header X-Powered-By;
