# ==========================================
# 1. 整合後的 HTTP (Port 80) 預設伺服器
# ==========================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 保留原本的健康檢查（允許 IP 直接打這個路徑進行監控）
    location /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # 其他所有未匹配的路徑，直接中斷連線
    location / {
        return 444;
    }
}

# ==========================================
# 2. 新增的 HTTPS (Port 443) 預設伺服器
#    目的是把透過 IP 連線伺服器的管道擋掉
#
#    ( Web Server Misconfiguration: SSL Certificate Hostname Discrepancy
#      ( 4725 ) CWE: 327,297 ) —— 跟 nginx_vm3 同樣的問題：用 IP 直連時
#      沒有正確的 SNI 可比對到任何具名 server_name，會落到這個
#      default_server，若繼續送出 fullcert_202606.crt 會造成憑證主機名稱
#      對不上。改用 ssl_reject_handshake 讓這類連線直接中斷 TLS 交握、
#      根本不送出任何憑證。需要 nginx >= 1.19.4。
#
#    注意：若之後用裸 IP 重新掃描這台機器，整個掃描會在 TLS 交握就被
#    中斷。詳見 setting.md。
# ==========================================
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_reject_handshake on;
}
