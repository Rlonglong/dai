# ========================================================
# 1. 全域區塊 (Server Block - HTTP)：負責處理未加密流量
#    行為: 透過 301 導向 HTTPS
# ========================================================
server {
    listen 80;                                 # 監聽 Port 80
    server_name auth.dai.post.gov.tw;      # 郵局分配給這台機器的這個服務網域
    # 行為：只要有人走 HTTP 進來，立刻強制 301 轉向到 HTTPS
    return 301 https://$host$request_uri;
}

# ========================================================
# 2. 全域區塊 (Server Block - HTTPS)：負責安全傳輸主核心
# ========================================================
server {
    listen 443 ssl;                            # 監聽 Port 443 並啟動 SSL 終止
    http2 on;                                  # 啟動 HTTP/2
    server_name auth.dai.post.gov.tw;      # 網域與上方相同，Nginx 會靠 TLS SNI 區分

    # ----------------------------------------------------
    # SSL 憑證宣告（對應到你掛載的 /etc/nginx/ssl 容器內路徑）
    # ----------------------------------------------------
    ssl_certificate     /etc/nginx/ssl/fullcert_202606.crt; 
    ssl_certificate_key /etc/nginx/ssl/dai_202606.key;

    # 安全性演算法與資安 Headers
    include conf.d/security.conf;

    # 把不允許使用者存取的目錄導向 404（跟 nginx_vm3 一致的共通強化，
    # 防止後端 Keycloak 若也有 /css|js|img/ 靜態目錄被列出內容）
    location ~* ^/(css|js|img)/$ {
        return 404;
    }

    # ----------------------------------------------------
    # 3. 路由區塊 (Location Block)：精準分流
    # ----------------------------------------------------

    # 路由 A：當網址後面有精準帶出 /control/ 時，把流量轉給洗浴中心
    location /control/ {
        resolver 127.0.0.11 valid=30s;

        set $upstream_kc_access "kc_access";
        proxy_pass http://$upstream_kc_access:8000/; # 轉發給 access-controller 容器
        
        # 轉發時帶上客戶端的真實 IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================================================================
    # 新增：針對 API 與身分驗證路徑，強制禁止快取 (解決 CWE-524 Cache Management)
    # 攔截 /realms/ 與 /admin/ 開頭的所有請求
    # =========================================================================
    location ~* ^/(realms|admin)/ {
        resolver 127.0.0.11 valid=30s;
        set $upstream_keycloak "keycloak";

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_pass http://$upstream_keycloak:8080; 

        # 【關鍵修復】：強制補上嚴格的防快取標頭
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https; 
        proxy_set_header X-Forwarded-Port 443;

        proxy_buffer_size          128k;
        proxy_buffers              4 256k;
        proxy_busy_buffers_size    256k;
    }

    # 路由 B：其餘預設所有流量 ( / )，全部交給 Keycloak 處理 (靜態資源等)
    location / {
        resolver 127.0.0.11 valid=30s;
        set $upstream_keycloak "keycloak";

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_pass http://$upstream_keycloak:8080; 
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https; 
        proxy_set_header X-Forwarded-Port 443;

        proxy_buffer_size          128k;
        proxy_buffers              4 256k;
        proxy_busy_buffers_size    256k;
    }
}