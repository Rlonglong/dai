server {
    listen 80;
    server_name dagster.dai.post.gov.tw;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name dagster.dai.post.gov.tw;

    ssl_certificate     /etc/nginx/ssl/fullcert_202606.crt;
    ssl_certificate_key /etc/nginx/ssl/dai_202606.key;

    # --- 加入以下緩衝區優化設定 ---
    proxy_buffer_size          128k;
    proxy_buffers              4 256k;
    proxy_busy_buffers_size    256k;
    # ------------------------------

    # 安全性演算法與資安 Headers
    include conf.d/security.conf;

    # 把不允許使用者存取的目錄導向 404（跟 nginx_vm3 一致的共通強化）
    location ~* ^/(css|js|img)/$ {
        return 404;
    }

    location / {
    # ⭐️ 關鍵：強制關閉後端的壓縮，讓 Nginx 能讀到原始 HTML
    # 注意：dagster-login 在 VM4，透過 extra_hosts 對應到 VM4_IP，
    #       不使用 Docker DNS resolver（127.0.0.11 只知道 vm5-network 的容器）
    proxy_set_header Accept-Encoding "";
    proxy_pass http://dagster-login:4180;
    
    # 確保設定沒有重複
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    
    # 你的按鈕注入邏輯 (我們改用更精簡的注入點)
    sub_filter '<div class="Box_pt8__puu7T Box_pr12__qmSIG Box_pb8__08QIH Box_pl12__SqJqE Box_flex__RnMbF Box_flexRow__FBM4W Box_alignCenter__iopRe"'
               '<a href="https://auth.dai.post.gov.tw/realms/postoffice/protocol/openid-connect/logout?post_logout_redirect_uri=https://dagster.dai.post.gov.tw/" style="text-decoration:none; color:inherit;">
                  <div style="padding: 10px; border: 1px solid #ddd; margin-bottom: 5px; border-radius: 4px; font-weight: bold; background: #f9f9f9;">🚪 登出系統</div>
                </a>
                <div class="Box_pt8__puu7T Box_pr12__qmSIG Box_pb8__08QIH Box_pl12__SqJqE Box_flex__RnMbF Box_flexRow__FBM4W Box_alignCenter__iopRe"';
    
    sub_filter_once on;
}
}
