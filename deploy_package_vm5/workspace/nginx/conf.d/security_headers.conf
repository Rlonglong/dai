# 共用安全標頭
# 因為 add_header 只要目前 context(server / location)自己宣告過任何一個
# add_header,就不會再繼承上層 context 的 add_header(是整組蓋掉，不是疊加）。
# 所以任何自己也有 add_header 的檔案都必須自行 include 這份檔案，
# 否則這三個安全標頭會在該 location 消失。目前這台機器（VM1）還沒有
# 任何 location 自帶 add_header，但先建立這份共用檔案，跟 nginx_vm3
# 保持一致，未來若新增 nocache / static_cache 之類的片段可以直接沿用。
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
