# =============================================================================
# VM4 → VM1 雜湊清單轉發設定
# 部署路徑：/etc/rsyslog.d/25-dai-integrity-fwd.conf
# =============================================================================
# log_hash.sh 每天算完雜湊後用
#     logger -t 'dai/log-integrity' '<manifest 一行>'
# 送進 rsyslog，這支設定把它「同時」轉發一份到 VM1 存放。
#
# 為什麼要存兩台：VM4 上的紀錄如果被動過，VM1 上還有一份可以比對。
# 對應的接收端設定是 VM1 的 workspace/rsyslog/vm1-integrity-server.conf。
#
# 使用前把 __VM1_IP__ 換成實際 IP：
#     sed -i 's/__VM1_IP__/<VM1實際IP>/g' /etc/rsyslog.d/25-dai-integrity-fwd.conf
# 防火牆要開 VM4 → VM1:514。
# =============================================================================

template(name="IntegrityFwdFmt" type="string"
  string="DAI|%TIMESTAMP:::date-rfc3339%|%HOSTNAME%|%syslogtag:R,ERE,1,ZERO:dai/([a-zA-Z0-9_-]+)--end%|%syslogseverity-text:::uppercase%|%msg:::drop-last-lf%\n")

# 只轉發本機產生的 dai/log-integrity（不要把收到的別台訊息再送出去，防迴圈）
if $syslogtag contains "dai/log-integrity" and $fromhost-ip == "127.0.0.1" then {

  # 1. 本機留一份
  action(type="omfile"
         file="/data/log/dai-integrity/manifest.log"
         Template="IntegrityFwdFmt"
         fileCreateMode="0640"
         fileOwner="root"
         fileGroup="dai_admin")

  # 2. 轉一份到 VM1
  action(type="omfwd"
         target="__VM1_IP__"
         port="514"
         protocol="tcp"
         queue.type="LinkedList"
         queue.size="10000"
         queue.filename="dai_integrity_fwd_q"
         queue.saveOnShutdown="on"
         action.resumeRetryCount="-1"
         action.resumeInterval="30")
  stop
}
