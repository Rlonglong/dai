# =============================================================================
# VM4 → VM1 hash 完整性 log 轉發設定
# 部署路徑：/etc/rsyslog.d/25-dai-integrity-fwd.conf
# =============================================================================
# log_hash.sh 每日 23:55 執行，用 logger -t dai/log-integrity 送出 hash manifest
# 本設定捕捉這些訊息並轉發至 VM1（只轉發本機產生的，防迴圈）
# =============================================================================
# 使用前請將 VM1_IP 替換為實際 IP：sed -i 's/10.28.155.104/<ip>/g' 此檔

if $syslogtag contains "dai/log-integrity" then {
  # Debug 測試用
  action(type="omfile" file="/tmp/rsyslog-debug.log")
  action(type="omfwd"
         target="10.10.159.74"
         port="514"
         protocol="tcp"
         queue.type="LinkedList"
         queue.size="1000"
         queue.filename="dai_integrity_q"
         queue.saveOnShutdown="on"
         action.resumeRetryCount="10"
         action.resumeInterval="60")

  stop
}