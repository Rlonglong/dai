# =============================================================================
# DAI rsyslog 集中收集伺服器設定（VM4 專用）
# 部署路徑：/etc/rsyslog.d/10-dai-server.conf
# =============================================================================
#
# 重要：rsyslog 的 $programname 只取 tag 斜線前的部分（nexflow/infra-db → nexflow）
#        必須用 $syslogtag 做條件判斷和路徑萃取

# --- 載入 TCP 接收模組（接收 VM1/3/5 轉發） ---
module(load="imtcp")
input(type="imtcp" port="514" ruleset="dai_remote")

# =============================================================================
# 落地格式 Template：DAI|<時間>|<來源VM>|<元件>|<嚴重度>|<訊息>
# syslogtag 格式：dai/infra-db[1599]: → 萃取 infra-db
# =============================================================================
template(name="DAIFmt" type="string"
  string="DAI|%TIMESTAMP:::date-rfc3339%|%HOSTNAME%|%syslogtag:R,ERE,1,ZERO:dai/([a-zA-Z0-9_-]+)--end%|%syslogseverity-text:::uppercase%|%msg:::drop-last-lf%\n")

# =============================================================================
# 動態檔案路徑 Template：
#   /data/log/dai/<來源VM>/<元件>/YYYY-MM-DD.log
# syslogtag "dai/gitlab[1234]:" → 目錄名稱 "gitlab"
# =============================================================================
template(name="DAIFile" type="string"
  string="/data/log/dai/%HOSTNAME%/%syslogtag:R,ERE,1,ZERO:dai/([a-zA-Z0-9_-]+)--end%/%$YEAR%-%$MONTH%-%$DAY%.log")

# =============================================================================
# Ruleset：處理遠端 VM 傳來的 log（VM1/3/5 → VM4）
# 只儲存，不回傳（防止迴圈）
# dirCreateMode: 2750 代表新建子目錄會繼承原有的權限設定
# =============================================================================
ruleset(name="dai_remote") {
  if $syslogtag contains "dai/" then {
    action(type="omfile"
           DynaFile="DAIFile"
           Template="DAIFmt"
           dirCreateMode="0750"
           fileCreateMode="0640"
           dirOwner="root"
           dirGroup="dai_admin"
           fileOwner="root"
           fileGroup="dai_admin")
    stop
  }
  stop
}

# =============================================================================
# 本機 Docker 容器 log（VM4 自身 dai/* 元件）
# fromhost-ip == 127.0.0.1 代表本機 Unix socket 來源
# =============================================================================
if $syslogtag contains "dai/" and not ($syslogtag contains "dai/log-integrity") and $fromhost-ip == "127.0.0.1" then {
  action(type="omfile"
         DynaFile="DAIFile"
         Template="DAIFmt"
         dirCreateMode="0750"
         fileCreateMode="0640"
         dirOwner="root"
         dirGroup="dai_admin"
         fileOwner="root"
         fileGroup="dai_admin")
  stop
}