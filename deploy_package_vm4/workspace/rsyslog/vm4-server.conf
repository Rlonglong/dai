# =============================================================================
# VM4 集中接收端設定（收 VM1 / VM3 / VM5 轉發過來的 dai/* log）
# 部署路徑：/etc/rsyslog.d/10-dai-server.conf
# =============================================================================
# 對應的轉發端設定是各機器上的 workspace/rsyslog/dai_client.conf
#（部署成 /etc/rsyslog.d/20-dai-client.conf，target 指到 VM4:514）
#
# ⚠️ dirOwner 必須是 rsyslog 實際執行的身分（RHEL 9 預設是 root，
#    Debian/Ubuntu 是 syslog）。填錯的話 rsyslog 會 chown 失敗、
#    目錄建不出來，log 靜默消失。用 `ps -o user= -C rsyslogd` 確認。
# =============================================================================

module(load="imtcp")
input(type="imtcp" port="514" ruleset="dai_recv")

# 落地格式：跟轉發端本機保存的格式一致，方便兩邊對照
template(name="DAIRecvFmt" type="string"
  string="DAI|%TIMESTAMP:::date-rfc3339%|%HOSTNAME%|%syslogtag:R,ERE,1,ZERO:dai/([a-zA-Z0-9_-]+)--end%|%syslogseverity-text:::uppercase%|%msg:::drop-last-lf%\n")

# 落地路徑：/data/log/dai/<來源主機>-<服務名>/<日期>.log
# 目錄名帶來源主機，才分得出同一個服務名是哪一台送來的
template(name="DAIRecvFile" type="string"
  string="/data/log/dai/%HOSTNAME%-%syslogtag:R,ERE,1,ZERO:dai/([a-zA-Z0-9_-]+)--end%/%$YEAR%-%$MONTH%-%$DAY%.log")

ruleset(name="dai_recv") {
  if $syslogtag contains "dai/" then {
    action(type="omfile"
           DynaFile="DAIRecvFile"
           Template="DAIRecvFmt"
           dirCreateMode="0750"
           fileCreateMode="0640"
           dirOwner="root"
           dirGroup="dai_admin"
           fileOwner="root"
           fileGroup="dai_admin")
    stop
  }
  stop
}
