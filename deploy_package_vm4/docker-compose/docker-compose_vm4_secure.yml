services:
  # -----------------------------------------------
  # 1. Infrastructure-db (PostgreSQL)
  #    Serve as backend for Keycloak, Dagster, Superset, D-Track
  # -----------------------------------------------
  infra-db:
    image: dai/postgres:v2.0
    container_name: infra-db
    restart: unless-stopped
    env_file:
      - ../env/vm4.env
    environment:
      TZ: Asia/Taipei
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    # 稽核日誌：連線記錄、DDL 語句、超時查詢���>1s）
    command: >
      postgres
        -c log_connections=on
        -c log_disconnections=on
        -c log_statement=ddl
        -c log_min_duration_statement=1000
        -c log_timezone=Asia/Taipei
        -c log_destination=stderr
        -c logging_collector=off
    volumes:
      - infra-db-data:/var/lib/postgresql
      - ../workspace/init-infra-db.sql:/docker-entrypoint-initdb.d/init.sql:ro,z
    ports:
      # 必須對外暴露，讓 VM3, VM5 可以連線
      - "${INFRA_DB_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: "syslog"
      options:
        tag: "dai/infra-db"
    networks:
      - vm4-network

  # ----------------------------------------
  # 2. Dagster SSO (OAuth2-Proxy)
  #    不在本次弱點防堵範圍內，沿用 docker-compose_vm4.yml 原設定。
  # ----------------------------------------
  dagster-login:
    image: dai/oauth:v1.0
    container_name: dagster-login
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_COOKIE_MINIMAL: "true"
      OAUTH2_PROXY_PROVIDER: "oidc"
      OAUTH2_PROXY_CLIENT_ID: "dagster"
      OAUTH2_PROXY_CLIENT_SECRET: ${DAGSTER_OIDC_CLIENT_SECRET}
      OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"
      OAUTH2_PROXY_OIDC_ISSUER_URL: "https://auth.dai.post.gov.tw/realms/postoffice"
      OAUTH2_PROXY_SSL_INSECURE_SKIP_VERIFY: "true"
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_SECRET: "SegoraDagsterProxySecret2026!@#$"
      OAUTH2_PROXY_COOKIE_DOMAIN: ".dai.post.gov.tw"
      OAUTH2_PROXY_UPSTREAMS: "http://dagster-webserver:3000"
      OAUTH2_PROXY_REDIRECT_URL: "https://dagster.dai.post.gov.tw/oauth2/callback"
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_SIGN_OUT_URL: "/oauth2/sign_out"
      OAUTH2_PROXY_REQUEST_LOGGING: "true"
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: "S256"
    ports:
      # 暴露給 VM5 的 Nginx 做反向代理
      - "${DAGSTER_LOGIN_PORT}:4180"
    logging:
      driver: "syslog"
      options:
        tag: "dai/dagster-login"
    extra_hosts:
      # 解析 SSO 網域到 VM5 的 IP
      - "auth.dai.post.gov.tw:${VM5_IP}"
    networks:
      - vm4-network

  # ----------------------------------------
  # 3. Dagster Code Location Server（gRPC）
  #    Security-hardened version
  #    Base: docker-compose_vm4.yml
  #    CVE reference: sast/report/dagster_v1_vulner_report.md
  #                    secure_report/dagster_secure_report.md
  #    範圍說明：本檔僅納入 dai/dagster:v2.0 的 3 個容器
  #    （dagster-code / dagster-webserver / dagster-daemon）。
  #    infra-db / dagster-login / gitlab-runner-cd 使用不同 image，
  #    不在本次弱點防堵範圍內，沿用 docker-compose_vm4.yml 原設定。
  # ----------------------------------------
  dagster-code:
    image: dai/dagster:v2.6
    container_name: dagster-code
    restart: unless-stopped

    # Dockerfile.dagster 已以 `USER dagster`（UID/GID 10001）建立並切換，
    # 此處明確重申，便於 host 層稽核 log 與 docker inspect 直接比對。
    user: "10001:10001"

    volumes:
      - ${DAGSTER_WORKSPACE}:/app/workspace:z
      - ${DAGSTER_DATA_DIR}:/data:z
    environment:
      - DAGSTER_HOME=/app/workspace/dagster_home
    command: >
      sh -c "mkdir -p /app/workspace/dagster_home &&
      touch /app/workspace/dagster_home/dagster.yaml &&
      dagster code-server start -h 0.0.0.0 -p 4000
      -f /app/workspace/hello_dagster.py"

    # [CVE-2026-24049 / CVE-2026-23949]（2026-06-30：AppArmor 已移除，見
    # secure_report/dagster_secure_report.md「AppArmor 移除與 SELinux 原生
    # 防線」）
    # no-new-privileges：禁止容器內任何程序透過 setuid/setgid 或 execve 提升權限。
    # seccomp：通用攻擊面縮減 baseline（mount/kernel module/kexec/ptrace/bpf 等），
    #          詳見 seccomp-dagster.json 檔頭說明（此 2 個 CVE 屬應用層 library
    #          漏洞，無法以 syscall 層級過濾，主要防線在 Dockerfile.dagster
    #          直接移除 pip/wheel，見下方說明）。
    # pip/wheel 的移除已在 Dockerfile.dagster build 階段完成（系統 Python 與
    # venv 皆移除 pip/wheel/easy_install 的 bin/ 與 site-packages），不需要
    # 任何 LSM（AppArmor/SELinux 自訂 type）規則。RHEL 9 上 container runtime
    # 預設套用的 SELinux `container_t` domain（不需自訂 type/policy module）
    # 做為被動的額外防線。
    security_opt:
      - no-new-privileges:true
      - seccomp:../security/seccomp-dagster.json

    # [CVE-2026-24049 / CVE-2026-23949]
    # 移除所有 Linux capabilities。gRPC code-server 僅需監聽 TCP 4000（非特權埠），
    # 無需任何特權 capability。
    cap_drop:
      - ALL

    # [CVE-2026-23949]
    # 根目錄設為 read-only，即使 jaraco.context tar 解壓觸發路徑穿越寫入，
    # 容器 overlay 根層本身不可寫，攻擊者無法在 / 任意位置植入檔案；
    # 可寫範圍限縮在下方 volumes 掛載（/app/workspace、/data）與 tmpfs。
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid
      - /run:size=16m,mode=0755,noexec,nosuid
      - /var/tmp:size=32m,mode=1777,noexec,nosuid
      # Dagster telemetry（即使 DAGSTER_DISABLE_TELEMETRY=1）仍會嘗試在
      # $HOME/.dagster 建立 user_id.yaml，read_only root fs 下需提供可寫 tmpfs。
      - /home/dagster:size=8m,mode=0700,uid=10001,gid=10001,noexec,nosuid

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M

    healthcheck:
      test: ["CMD-SHELL", "python -c \"import grpc; ch=grpc.insecure_channel('localhost:4000'); grpc.channel_ready_future(ch).result(timeout=5)\" || exit 1"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 5
    logging:
      driver: "syslog"
      options:
        tag: "dai/dagster-code"
    networks:
      - vm4-network

  # ----------------------------------------
  # 2. Dagster Web UI
  #    Security-hardened version（設定邏輯同 dagster-code，見上方註解）
  # ----------------------------------------
  dagster-webserver:
    image: dai/dagster:v2.6
    container_name: dagster-webserver
    restart: unless-stopped
    user: "10001:10001"

    volumes:
      - ${DAGSTER_WORKSPACE}:/app/workspace:z
      - ${DAGSTER_DATA_DIR}:/data:z
    environment:
      - DAGSTER_HOME=/app/workspace/dagster_home
      # - DAGSTER_WEBSERVER_PATH_PREFIX=/dagster/project-refact
    command: >
      sh -c "mkdir -p /app/workspace/dagster_home &&
      touch /app/workspace/dagster_home/dagster.yaml &&
      dagster-webserver -h 0.0.0.0 -p 3000 -w /app/workspace/workspace.yml"

    # （2026-06-30：AppArmor 已移除，設定邏輯同 dagster-code，見上方註解）
    security_opt:
      - no-new-privileges:true
      - seccomp:../security/seccomp-dagster.json
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid
      - /run:size=16m,mode=0755,noexec,nosuid
      - /var/tmp:size=32m,mode=1777,noexec,nosuid
      # Dagster telemetry（即使 DAGSTER_DISABLE_TELEMETRY=1）仍會嘗試在
      # $HOME/.dagster 建立 user_id.yaml，read_only root fs 下需提供可寫 tmpfs。
      - /home/dagster:size=8m,mode=0700,uid=10001,gid=10001,noexec,nosuid

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 256M

    # 注意：本服務未對 host 發布 port（compose 無 ports: 區塊），3000 埠僅在
    # vm4-network bridge 內部可達，由 dagster-login（OAuth2-Proxy）以容器名稱
    # 反向代理（OAUTH2_PROXY_UPSTREAMS=http://dagster-webserver:3000）。
    # 對外實際邊界是 dagster-login 的 ${DAGSTER_LOGIN_PORT}，再由 VM5 Nginx
    # 反向代理轉送。網路層防護建議見 secure_report/dagster_secure_report.md。
    depends_on:
      dagster-code:
        condition: service_healthy
    logging:
      driver: "syslog"
      options:
        tag: "dai/dagster-webserver"
    networks:
      - vm4-network

  # ----------------------------------------
  # 3. Dagster Daemon
  #    Security-hardened version（設定邏輯同 dagster-code，見上方註解）
  # ----------------------------------------
  dagster-daemon:
    image: dai/dagster:v2.6
    container_name: dagster-daemon
    restart: unless-stopped
    user: "10001:10001"
    group_add:
      - "969"

    volumes:
      - ${DAGSTER_WORKSPACE}:/app/workspace:z
      # 既有設計：掛載 host docker.sock 供 DockerRunLauncher 使用。
      # 此掛載授予容器近乎 host root 等級權限，與本次 2 個 setuptools vendor
      # CVE 無關但風險層級更高，建議另案評估（見 secure_report 待辦事項）；
      # 本次未變更此既有掛載範圍。
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DAGSTER_DATA_DIR}:/data:z
      - /home/dagster_user/.ssh:/home/dagster_user/.ssh:ro
    environment:
      - DAGSTER_HOME=/app/workspace/dagster_home
    command: >
      sh -c "mkdir -p /app/workspace/dagster_home &&
      touch /app/workspace/dagster_home/dagster.yaml &&
      dagster-daemon run -w /app/workspace/workspace.yml"

    # （2026-06-30：AppArmor 已移除，設定邏輯同 dagster-code，見上方註解）
    security_opt:
      - no-new-privileges:true
      - seccomp:../security/seccomp-dagster.json
    # 注意：cap_drop ALL 與 read_only 不影響 docker.sock 存取（純檔案 I/O，
    # 非 Linux capability 需求）；docker.sock 本身的 UID/GID 權限相容性
    # （host 通常為 root:docker，容器內為 10001:10001）請部署前另行確認，
    # 非本次 2 個 HIGH CVE 防堵範圍。
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid
      - /run:size=16m,mode=0755,noexec,nosuid
      - /var/tmp:size=32m,mode=1777,noexec,nosuid
      # Dagster telemetry（即使 DAGSTER_DISABLE_TELEMETRY=1）仍會嘗試在
      # $HOME/.dagster 建立 user_id.yaml，read_only root fs 下需提供可寫 tmpfs。
      - /home/dagster:size=8m,mode=0700,uid=10001,gid=10001,noexec,nosuid

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 16G
        reservations:
          memory: 256M

    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os; cmds=[open(f'/proc/{p}/cmdline').read() for p in os.listdir('/proc') if p.isdigit() and os.path.exists(f'/proc/{p}/cmdline')]; exit(0 if any('dagster-daemon' in c for c in cmds) else 1)\""]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    depends_on:
      dagster-code:
        condition: service_healthy
    logging:
      driver: "syslog"
      options:
        tag: "dai/dagster-daemon"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - vm4-network

  # ----------------------------------------
  # 6. GitLab Runner (CD — 負責自動部署)
  # ----------------------------------------
  gitlab-runner-cd:
    image: dai/gitlab-runner:v2.1
    container_name: gitlab-runner-cd
    restart: unless-stopped
    volumes:
      - ../workspace/gitlab-runner-cd:/etc/gitlab-runner:z
      - /data/deploy/certs:/etc/gitlab-runner/certs:z
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "gitlab.dai.post.gov.tw:${VM3_IP}"
    logging:
      driver: "syslog"
      options:
        tag: "dai/gitlab-runner-vm4"
    networks:
      - vm4-network

volumes:
  infra-db-data:

networks:
  vm4-network:
    driver: bridge
