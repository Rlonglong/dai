server {
    listen 80;                                 # 監聽 Port 80
    server_name dtrack.dai.post.gov.tw;      
    return 301 https://$host$request_uri;
}

# ========================================================
# 全域區塊 (Server Block - HTTPS)：負責安全傳輸主核心
# ========================================================
server {
    listen 443 ssl;
    http2 on;
    server_name dtrack.dai.post.gov.tw;
    client_max_body_size 20M;

    ssl_certificate     /etc/nginx/ssl/fullcert_202606.crt;
    ssl_certificate_key /etc/nginx/ssl/dai_202606.key;

    # 安全性演算法與資安 Headers
    include conf.d/security.conf;

    # 解決前端洩漏開發者資訊 ( Poor Error Handling: Unhandled Exception ( 810 ) CWE: 209)
    sub_filter 'C:/Users/' '/src/';
    sub_filter_once off;
    sub_filter_types application/javascript text/css;
    gzip off; # 確保關閉 gzip 以利 Nginx 進行明文替換

    # 把不允許使用者存取的目錄導向 404 ( Web Server Misconfiguration: Server Error Message ( 10932 ) CWE: 550)
    location ~* ^/(css|js|img)/$ {
        return 404;
    }
    # --------------------------------------------------------
    # 路由 A：API (dtrack-server) - 一律禁止快取
    # --------------------------------------------------------
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $upstream_dtrack_server "dtrack-server";

        proxy_pass http://$upstream_dtrack_server:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # 引入 API 拒絕快取設定（內含 always，401/403/404 等錯誤狀態碼也會被套用）
        include conf.d/nocache.conf;

        
        # 1. 隱藏後端 Java 程式原本輸出的寬鬆 CORS 標頭（這步是關鍵！）
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Max-Age;

        # 2. CORS 白名單（CWE-942 / WebInspect 11278、11279：舊寫法直接把
        #    $http_origin 原樣反射回去，等於允許任何來源，掃描器拿假的
        #    Origin: http://webinspect.microfocus.com 也會被放行。改成只
        #    比對允許清單，不在名單內的來源完全不會拿到 CORS 標頭）
        set $cors_allowed 0;
        if ($http_origin = "https://dtrack.dai.post.gov.tw") {
            set $cors_allowed 1;
        }
        if ($http_origin = "https://gitlab.dai.post.gov.tw") {
            set $cors_allowed 1;
        }

        # Access-Control-Allow-Origin 是依 Origin 動態產生的內容，一定要帶
        # Vary: Origin，否則會有快取污染風險（CWE-524 / WebInspect 11619）
        add_header Vary "Origin" always;

        if ($cors_allowed) {
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Origin, Content-Type, Authorization, X-Requested-With, Content-Length, Accept, X-Api-Key" always;
            add_header Access-Control-Allow-Credentials "true" always;
            # 預檢快取時間維持 5 分鐘（< 30 分鐘），避免 CWE-525 / WebInspect 11280
            add_header Access-Control-Max-Age "300" always;
        }

        # 處理瀏覽器的預檢請求 (Preflight OPTIONS)
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        proxy_intercept_errors on;
        error_page 500 502 503 504 = @api_50x;
    }

    location @api_50x {
    internal;
    default_type application/json;
    return 500 '{"message":"An internal error occurred. Please contact the administrator."}';
    }

    # --------------------------------------------------------
    # 路由 B-1：前端靜態資源（含 hash 檔名的 js/css/圖片）- 允許長快取
    #
    # 【注意 - regex location 順序問題】
    # 這是 regex location（~*）。nginx 比對規則是：先找 prefix location
    # 中最長匹配的那個，但只要有任何 regex location 命中，就會「優先於」
    # 該 prefix 結果生效（除非該 prefix 用了 ^~ 或 = 精確匹配修飾符）。
    # 因此這條規則放在 location / 前面或後面都沒差，都會蓋過 /。
    #
    # 但如果之後新增第二條、第三條 regex location（例如額外用 ~* 比對
    # /api 或 /graphql 之類的路徑），regex location 之間是「依照設定檔
    # 中出現的先後順序，第一個比對成功的就採用」，不是取最長匹配、
    # 也不是精確度優先。之後新增規則時務必注意排列順序，把範圍較窄、
    # 較特定的規則放前面，避免被範圍較寬的規則套用錯誤的快取策略。
    # --------------------------------------------------------
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
        resolver 127.0.0.11 valid=30s;
        set $upstream_dtrack_frontend "dtrack-frontend";

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://$upstream_dtrack_frontend:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        proxy_buffer_size          128k;
        proxy_buffers              4 256k;
        proxy_busy_buffers_size    256k;

        # 靜態資源允許快取
        include conf.d/static_cache.conf;
    }

    # --------------------------------------------------------
    # 路由 B-2：前端 UI 畫面（SPA 入口 index.html / 動態設定檔）
    #
    # 注意：index.html（以及若有前端執行期設定檔，例如 env-config.json
    # 之類非 hash 檔名的檔案）不應套用長快取。原因是部署新版前端時，
    # 瀏覽器必須能立即拿到最新的 index.html，否則使用者端會卡在舊版
    # 前端，甚至可能因為前端版本落後導致呼叫到不相容的 API。
    # --------------------------------------------------------
    location / {
        resolver 127.0.0.11 valid=30s;
        set $upstream_dtrack_frontend "dtrack-frontend";

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_pass http://$upstream_dtrack_frontend:8080; 
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https; 
        proxy_set_header X-Forwarded-Port 443;

        proxy_buffer_size          128k;
        proxy_buffers              4 256k;
        proxy_busy_buffers_size    256k;

        # 前端其他動態資源同樣不允許快取
        include conf.d/nocache.conf;
    }
}