server {
    listen 80;
    server_name gitlab.dai.post.gov.tw;
    # 強制轉跳 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name gitlab.dai.post.gov.tw;
    
    # 憑證路徑 (請根據你 Nginx 容器內部的實際路徑填寫)
    ssl_certificate     /etc/nginx/ssl/fullcert_202606.crt;
    ssl_certificate_key /etc/nginx/ssl/dai_202606.key;

    # 安全性演算法與資安 Headers
    include conf.d/security.conf;

    # --- 加入以下緩衝區優化設定 ---
    proxy_buffer_size          128k;
    proxy_buffers              4 256k;
    proxy_busy_buffers_size    256k;
    # ------------------------------

    # --- 輸入大小／逾時上限 ---
    client_header_timeout      10s;
    client_body_timeout        30s;
    large_client_header_buffers 4 16k;
    client_max_body_size       0;
    # ------------------------------

    # 把不允許使用者存取的目錄導向 404 ( Web Server Misconfiguration: Server Error Message ( 10932 ) CWE: 550)
    location ~* ^/(css|js|img)/$ {
        return 404;
    }
    
    # =========================================================================
    # 新增：專門處理 API 路徑，強制禁止快取 (解決 CWE-524 Cache Management)
    # 掃描工具攻擊的 /api/graphql、/apis/helm... 皆會被此規則攔截
    # =========================================================================
    location ~* ^/api {
        resolver 127.0.0.11 valid=30s;
        set $upstream_gitlab "gitlab"; 
        proxy_pass http://$upstream_gitlab:80;
        
        # 【關鍵修復】: always 參數會確保即使 GitLab 回傳 302 重導向或 400 錯誤，Nginx 依然會強制貼上這些標頭！
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Ssl on;
    }
    
    # =========================================================================
    # 原有的全域反向代理 (處理一般網頁瀏覽、靜態資源等，維持原有快取效能)
    # =========================================================================
    location / {
        resolver 127.0.0.11 valid=30s;
        set $upstream_gitlab "gitlab"; 
        proxy_pass http://$upstream_gitlab:80;
        
        # 必須明確告知後端這是一條 HTTPS 連線
        # 如果漏了這幾行，GitLab 會陷入 301 重新導向迴圈 (Redirect Loop)
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https; # 強制告訴 GitLab 外部是 https
        proxy_set_header X-Forwarded-Ssl on;
    }
}