# ==========================================
# 1. 整合後的 HTTP (Port 80) 預設伺服器
# ==========================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 保留原本的健康檢查（允許 IP 直接打這個路徑進行監控）
    location /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # 其他所有未匹配的路徑，直接中斷連線
    location / {
        return 444;
    }
}

# ==========================================
# 2. 新增的 HTTPS (Port 443) 預設伺服器
#    目的是把透過 IP 連線伺服器的管道擋掉
#
#    ( Web Server Misconfiguration: SSL Certificate Hostname Discrepancy
#      ( 4725 ) CWE: 327,297 ) —— 用 IP 直連時，沒有正確的 SNI 可以比對到
#      任何一個具名 server_name，就會落到這個 default_server，之前這裡
#      還是會把 fullcert_202606.crt（CN 是 dagster.dai.post.gov.tw）送出
#      去，造成憑證主機名稱對不上的誤判。改用 ssl_reject_handshake 讓
#      這類連線直接中斷 TLS 交握、根本不送出任何憑證，從源頭排除這個問題。
#      需要 nginx >= 1.19.4。
#
#    注意：若公司之後仍用裸 IP（例如 https://10.10.159.76）重新掃描，
#    整個掃描會在 TLS 交握就被中斷，等於「連不上」而非「弱點已修復」。
#    詳見 setting.md。
# ==========================================
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_reject_handshake on;
}