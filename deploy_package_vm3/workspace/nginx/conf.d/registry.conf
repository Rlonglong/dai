# Container Registry 反向代理（2026-07-01 改為與 GitLab 共用同一個 domain）
# 對應 secure_report/gitlab_secure_report.md「四、Go 二進位依賴弱點」
# 架構說明：Container Registry 是 gitlab 容器內的 omnibus runit 服務
# （registry['enable'] = true，見 docker-compose_vm3_secure.yml），不是
# 獨立容器。與 GitLab 共用 gitlab.dai.post.gov.tw 同一個 domain，
# 不開新的 registry.dai.post.gov.tw 子網域；改用 port 5050 區分
# （GitLab 官方支援的設定方式之一：同 domain 不同 port。GitLab 不支援
# 用路徑掛在跟主站完全相同的 domain+port 下，因為 Docker Registry API
# 用戶端不支援 path-prefixed registry）。
#
# 需要 docker-compose_vm3_secure.yml 的 nginx-vm3 服務新增
# `ports: - "5050:5050"` host port 對應（與 gitlab.conf 不同，
# gitlab.conf 沿用 443 不需要額外開 port）。

# [CVE-2026-33186 / 33815 / 33816 / 25680 系列] rate limit zone，限制單一
# 來源 IP 對 registry push/pull API 的請求速率，降低觸發異常查詢結果
# （pgx CRITICAL）或大量並發連線耗用資源的機率。
limit_req_zone $binary_remote_addr zone=registry_api:10m rate=30r/s;

server {
    listen 5050 ssl;
    http2 on;
    server_name gitlab.dai.post.gov.tw;
    # 憑證路徑（與 gitlab.conf 共用同一張憑證，同 domain 不需要另外簽發）
    ssl_certificate     /etc/nginx/ssl/fullcert_202606.crt;
    ssl_certificate_key /etc/nginx/ssl/dai_202606.key;

    # 安全性演算法與資安 Headers
    include conf.d/security.conf;

    # Container Registry 的 image layer blob 可能很大且上傳耗時較久，
    # 故 client_max_body_size 比照 gitlab.conf 設為 unlimited（GitLab 官方
    # 預設值，見 gitlab.conf 內的說明），並拉長 proxy_read_timeout，避免
    # 大型 image push 中途被逾時切斷。
    chunked_transfer_encoding on;
    client_max_body_size 0;
    proxy_read_timeout 900s;

    # 把不允許使用者存取的目錄導向 404 ( Web Server Misconfiguration: Server Error Message ( 10932 ) CWE: 550)
    location ~* ^/(css|js|img)/$ {
        return 404;
    }

    location / {
        # [CVE-2026-33186 / 33815 / 33816 / 25680 系列]
        limit_req zone=registry_api burst=60 nodelay;

        resolver 127.0.0.11 valid=30s;
        set $upstream_gitlab "gitlab";
        # 轉發到 gitlab 容器內建 nginx 的 registry 專用 port（5050），
        # 與主要 GitLab app（port 80）區分；同 domain 下兩者用後端 port
        # 分流，不能再靠 Host header（兩者 Host 完全相同）。
        proxy_pass http://$upstream_gitlab:5050;

        # 必須明確告知後端這是一條 HTTPS 連線（與 gitlab.conf 原理相同）
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Ssl on;

        include conf.d/nocache.conf;
    }
}
