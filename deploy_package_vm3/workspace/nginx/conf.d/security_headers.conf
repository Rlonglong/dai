# 共用安全標頭
# 因為 add_header 只要目前 context(server / location)自己宣告過任何一個
# add_header,就不會再繼承上層 context 的 add_header(是整組蓋掉，不是疊加）。
# 所以任何自己也有 add_header 的檔案（nocache.conf、static_cache.conf、
# 各 location 內自訂的 CORS 標頭等）都必須自行 include 這份檔案，
# 否則這三個安全標頭會在該 location 消失。
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
