# =============================================================================
# VM3 GitLab 應用層 log 監聽（rsyslog imfile 模組）
# 部署路徑：/etc/rsyslog.d/30-dai-gitlab-imfile.conf
# =============================================================================
# GitLab logs 位於 ${GITLAB_HOME}/logs/（docker-compose volume 掛載）
# 三個關鍵稽核 log 檔透過 imfile 注入 rsyslog，再由 dai-client.conf 轉發至 VM4
# =============================================================================

module(load="imfile" PollingInterval="10")

# -----------------------------------------------------------------------------
# 1. auth_json.log — 認證事件（登入/登出/SSO/PAT）
# -----------------------------------------------------------------------------
input(type="imfile"
      File="/var/log/gitlab/logs/gitlab-rails/auth_json.log"
      Tag="dai/gitlab-auth"
      Severity="info"
      Facility="local0"
      PersistStateInterval="100"
      startmsg.regex="^\\{")

# -----------------------------------------------------------------------------
# 2. audit_json.log — 操作稽核（權限異動/admin操作/Runner token）
# -----------------------------------------------------------------------------
input(type="imfile"
      File="/var/log/gitlab/logs/gitlab-rails/audit_json.log"
      Tag="dai/gitlab-audit"
      Severity="info"
      Facility="local0"
      PersistStateInterval="100"
      startmsg.regex="^\\{")

# -----------------------------------------------------------------------------
# 3. nginx/gitlab_access.log — GitLab 內部 nginx HTTP 存取記錄
# -----------------------------------------------------------------------------
input(type="imfile"
      File="/var/log/gitlab/logs/nginx/gitlab_access.log"
      Tag="dai/gitlab-api-http"
      Severity="info"
      Facility="local0"
      PersistStateInterval="100")
