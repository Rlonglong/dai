# =============================================================================
# gitleaks 設定 —— 機密外洩偵測
# =============================================================================
# 三個地方都吃這份設定，規則永遠一致：
#   1. 本地 pre-commit hook   → gitleaks protect --staged
#   2. 本地 pre-push  hook    → gitleaks detect --log-opts=<即將推送的 commit 範圍>
#   3. GitLab pre-receive hook（VM3，伺服器端，擋不掉）→ 同 2
#   4. CI 的 secret-scanning job（全樹 + 全歷史，最後一道防線）
#
# ★ allowlist 是「明知道是假值」才放行 ★
#   絕對不要因為「掃到了很煩」就把路徑加進來。
#   真的誤判請用最小範圍的 regex + 註明理由。
# =============================================================================

title = "DAI gitleaks config"

# 繼承 gitleaks 內建的全部規則（AWS/GCP/Slack/私鑰/generic-api-key ...）
[extend]
useDefault = true

# -----------------------------------------------------------------------------
# 自訂規則：內建規則抓不到、但本專案特別在意的東西
# -----------------------------------------------------------------------------

# ★ secretGroup 一定要設 ★
#   不設的話 gitleaks 會把「第一個捕獲群組」當成 secret，也就是變數名稱
#   （例如 DB_PASS）而不是值。後果有兩個：
#     1. 報告裡看到的是變數名，看不出洩漏的是什麼
#     2. allowlist 的 regex 是拿 secret 去比對的，永遠比不到值 → allowlist 失效
#   下面每條規則的 secretGroup 都指向「值」那一組。

[[rules]]
id = "dai-db-connection-password"
description = "資料庫連線密碼寫死在程式碼／設定檔"
regex = '''(?i)(DB_PASS|MSSQL_PASSWORD|SOURCE_DB_PASS|SA_PASSWORD)\s*[=:]\s*['"]?([^\s'"<$#{][^\s'"]{5,})'''
secretGroup = 2
tags = ["dai", "database"]

[[rules]]
id = "dai-zip-password"
description = "來源檔 ZIP 解壓密碼"
regex = '''(?i)(ZIP_PWD_[A-Z_]+)\s*[=:]\s*['"]?([^\s'"<$#{][^\s'"]{3,})'''
secretGroup = 2
tags = ["dai", "credential"]

[[rules]]
id = "dai-encryption-key"
description = "欄位加解密金鑰"
regex = '''(?i)(CSV_ENCRYPTION_KEY|SOURCE_DECRYPT_KEY|ENCRYPTION_KEY)\s*[=:]\s*['"]?([^\s'"<$#{][^\s'"]{8,})'''
secretGroup = 2
tags = ["dai", "crypto"]

[[rules]]
id = "dai-oidc-client-secret"
description = "Keycloak / OIDC client secret"
regex = '''(?i)(client_secret|OIDC_SECRET)\s*[=:]\s*['"]?([A-Za-z0-9._\-]{16,})'''
secretGroup = 2
tags = ["dai", "oidc"]

[[rules]]
id = "dai-dtrack-api-key"
description = "Dependency-Track API Key"
regex = '''(?i)(DTRACK_API_KEY|X-Api-Key)\s*[=:]\s*['"]?(odt_[A-Za-z0-9._\-]{20,}|[A-Za-z0-9._\-]{30,})'''
secretGroup = 2
tags = ["dai", "dtrack"]

# -----------------------------------------------------------------------------
# allowlist
# -----------------------------------------------------------------------------
[allowlist]
description = "已確認為範本／說明文字的假值"

# 拿「整行」去比對 allowlist regex，而不是只比對捕獲到的 secret。
# 因為誤判的判斷依據常常在值以外的地方（例如 `= os.getenv(` 這個寫法本身），
# 只比對值的話規則會寫得又長又脆。
regexTarget = "line"

paths = [
    # 範本檔本來就是拿來給人複製的，裡面只有佔位符
    '''dagster_workspace/dbt_project/profiles\.yml\.example''',
    '''.*\.example$''',
    # 手冊截圖
    '''docs/.*/images/.*''',
    # gitleaks 自己的設定檔（裡面的 regex 會被自己的規則掃到）
    '''\.gitleaks\.toml''',
]

regexes = [
    # ---- 從環境變數讀取，不是寫死的字面值 ----
    # `DB_PASS = os.getenv("DB_PASS")` 是我們**希望**看到的寫法，不能報它。
    # 這是自訂規則最主要的誤判來源。
    '''os\.getenv''',
    '''os\.environ''',
    '''getenv\s*\(''',
    '''environ\s*\[''',
    '''dotenv''',
    '''\bEnv\s*\(''',

    # ---- 文件裡的示範值 ----
    # 部署手冊的慣例：以 Your... 開頭，或用 <...> 包起來
    '''Your[A-Za-z]*Secret''',
    '''<[^>]{2,60}>''',
    # 中文佔位符（手冊裡寫「實際密碼」「壓縮密碼」這種說明文字）
    '''(實際|你的|範例|測試用|壓縮)?密碼''',
    '''金鑰$''',

    # ---- shell / CI 變數展開，不是字面值 ----
    '''\$\{?[A-Za-z_][A-Za-z0-9_]*\}?''',

    # ---- 佔位符慣例 ----
    '''(?i)(changeme|placeholder|xxxxx+|example|dummy|redacted|todo)''',

    # ---- hook 自我測試用的字串 ----
    # docs/GitLab維運手冊 與部署手冊 Phase 4D 教大家用這串去驗證
    # pre-receive hook 有沒有生效。它必須長得像真的金鑰（否則測不出東西），
    # 但它確實不是任何系統的密碼。改這串的話兩份文件也要一起改。
    '''ThisIsAFakePasswordForTesting123''',

    # ---- 已知的公開預設值（首次登入用，部署當下就會被改掉）----
    '''admin/admin''',
    '''storepass changeit''',
]

# 停用的內建規則（附理由）
stopwords = []
