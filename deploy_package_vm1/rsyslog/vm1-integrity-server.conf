# =============================================================================
# VM1 hash 完整性接收伺服器設定
# 部署路徑：/etc/rsyslog.d/10-dai-integrity-server.conf
# =============================================================================
# 接收 VM4 傳來的 dai/log-integrity 訊息，儲存至本機
# 只接受來自 VM4 IP 的連線（規則集層面過濾）
# =============================================================================
# VM4_IP：10.10.159.15

module(load="imtcp")
input(type="imtcp" port="514" ruleset="integrity_recv")

template(name="IntegrityFmt" type="string"
  string="DAI|%TIMESTAMP:::date-rfc3339%|%HOSTNAME%|%syslogtag:R,ERE,1,ZERO:dai/([a-zA-Z0-9_-]+)--end%|%syslogseverity-text:::uppercase%|%msg:::drop-last-lf%\n")

template(name="IntegrityFile" type="string"
  string="/var/log/dai-integrity/%$YEAR%-%$MONTH%-%$DAY%.log")

ruleset(name="integrity_recv") {
  # 只處理來自 VM4 的 dai/log-integrity 訊息
  if $syslogtag contains "dai/log-integrity" and $fromhost-ip == "10.10.159.15" then {
    action(type="omfile"
           DynaFile="IntegrityFile"
           Template="IntegrityFmt"
           dirCreateMode="0750"
           fileCreateMode="0640")
    stop
  }
  stop
}
