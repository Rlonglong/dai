# =============================================================================
# DAI · bcp-scripts —— GitLab CI/CD（VM1 執行腳本）
# =============================================================================
# 跟 dagster_workspace repo 是同一套設計，差別只有三點：
#   1. SOURCE_DIR = "."      整個 repo 就是部署內容（不是某個子目錄）
#   2. 部署目標是 VM1        /home/bcp_runner/scripts
#   3. 有 requirements.txt   所以 SCA 直接掃它，不需要 DTRACK_IMAGE
#
# 檢查規則（.gitleaks.toml / .flake8 / ci/bandit.yaml）與 ci/ 底下的腳本
# 跟 dagster_workspace repo **完全相同**，直接複製過來即可。
# 兩邊刻意保持一致，開發者換 repo 不用重學一套。
# =============================================================================

variables:
  GIT_STRATEGY: fetch
  GIT_CLEAN_FLAGS: -ffdx
  GIT_DEPTH: 0
  DAI_LOG_TAG: "dai/gitlab-sync"
  SOURCE_DIR: "."

stages:
  - lint
  - test
  - security
  - deploy
  - verify

default:
  before_script:
    - source ~/.venv/bin/activate || echo "沒有 ~/.venv，改用系統 Python"
    - python --version
    - chmod +x ci/*.sh ci/hooks/* 2>/dev/null || true
  interruptible: true

.rules_mr_and_push: &rules_mr_and_push
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS == null
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# 排程有兩種，用 SCHEDULE_TYPE 區分，否則兩種排程會互相觸發對方的 job：
#   SCHEDULE_TYPE=verify     每天 08:30  → 只跑雜湊對帳
#   SCHEDULE_TYPE=quarterly  每季 1 號   → 完整資安複掃
.rules_security: &rules_security
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS == null
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TYPE == "quarterly"

# =============================================================================
# lint
# =============================================================================
format-check:
  stage: lint
  tags: [vm3, ci]
  script: [ci/lint.sh format]
  <<: *rules_mr_and_push

lint-check:
  stage: lint
  tags: [vm3, ci]
  script: [ci/lint.sh style]
  <<: *rules_mr_and_push

# =============================================================================
# test
# =============================================================================
unit-tests:
  stage: test
  tags: [vm3, ci]
  script:
    - |
      if [ ! -d tests ]; then
        echo "目前沒有 tests/ 目錄，略過單元測試。"
        exit 0
      fi
    - python -m pytest --cov --cov-report=xml --cov-report=term
  coverage: '/TOTAL.*\s+(\d+%)/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 1 week
  <<: *rules_mr_and_push

syntax-compile:
  # 比單元測試更基本、但擋得住最痛的問題：
  # 推一支語法錯的腳本上 VM1，會等到當晚排程跑到才爆，那時候資料已經延遲了。
  stage: test
  tags: [vm3, ci]
  script:
    - python -m compileall -q .
  <<: *rules_mr_and_push

# =============================================================================
# security
# =============================================================================
secret-scanning:
  stage: security
  tags: [vm3, ci]
  script:
    - ci/check_secrets.sh tree
    - ci/check_secrets.sh history
  <<: *rules_security

sast-bandit:
  stage: security
  tags: [vm3, ci]
  script: [ci/lint.sh sast]
  <<: *rules_security

sca-dtrack:
  stage: security
  tags: [vm3, ci]
  script:
    # 這個 repo 有 requirements.txt，build_sbom.sh 會自動走那條路徑
    - ci/build_sbom.sh
  artifacts:
    when: always
    paths: [bom.json]
    expire_in: 1 week
  rules:
    # 刻意不含 schedule：每季複掃交給 sca-dtrack-quarterly，
    # 兩個都跑會對同一個 D-Track 專案版本重複上傳 SBOM。
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS == null
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# -----------------------------------------------------------------------------
# 定期弱掃（每季一次）
# -----------------------------------------------------------------------------
# 推送時掃的是「這份程式碼當下有沒有已知弱點」，但弱點資料庫每天在長 ——
# 程式碼一行沒改，風險卻會變。所以每季用最新的弱點資料庫重掃一次。
#
# 這個 repo 特別重要：VM1 的腳本碰得到明碼個資與交易明細，
# 它依賴的 cryptography / pymssql / pandas 一旦出 CVE，影響的是資料本身。
#
# 排程：Settings → CI/CD → Schedules
#   Cron: 0 3 1 */3 *      Variables: SCHEDULE_TYPE = quarterly
# -----------------------------------------------------------------------------
sca-dtrack-quarterly:
  stage: security
  tags: [vm3, ci]
  variables:
    DTRACK_FAIL_ON_HIGH: "1"
    DTRACK_POLL_MAX: "36"
  script:
    - ci/build_sbom.sh
  artifacts:
    when: always
    paths: [bom.json]
    expire_in: 1 year        # 稽核用
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TYPE == "quarterly"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: false

# =============================================================================
# deploy
# =============================================================================
deploy:production:
  stage: deploy
  tags: [vm3, cd]
  environment:
    name: production
    deployment_tier: production
  variables:
    DEPLOY_PATH: "/home/bcp_runner/scripts"
    POST_DEPLOY_CMD: "sudo /usr/local/sbin/dai-post-deploy-vm1.sh"
  script:
    - ci/deploy_rsync.sh
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  interruptible: false
  resource_group: production-vm1

deploy:staging:
  stage: deploy
  tags: [vm3, cd]
  environment:
    name: staging
    deployment_tier: staging
  variables:
    DEPLOY_PATH: "/home/bcp_runner/scripts"
    POST_DEPLOY_CMD: "sudo /usr/local/sbin/dai-post-deploy-vm1.sh"
  script:
    - ci/deploy_rsync.sh
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
  interruptible: false
  resource_group: staging-vm1

# =============================================================================
# verify —— 每日雜湊對帳
# =============================================================================
verify:production:
  stage: verify
  tags: [vm3, cd]
  environment:
    name: production
    action: verify
  variables:
    DEPLOY_PATH: "/home/bcp_runner/scripts"
  script:
    - ci/verify_sync.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TYPE == "verify"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: false
  retry:
    max: 2
    when: [runner_system_failure, stuck_or_timeout_failure]
